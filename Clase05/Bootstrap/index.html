<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medellín Tech Conference</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container py-4">
        <h1>Medellín Tech Conference</h1>
        <p>Innovación, desarrollo web y tecnología.</p>
        <div class="bg-primary text-white p-3">Primary</div>
        <div class="bg-success text-white p-3">Success</div>
        <div class="bg-warning text-dark p-3">Warning</div>
        <div class="bg-danger text-white p-3">Danger</div>
    </div>

    <div class="container my-4">
        <div class="row g-3">
            <div class="col-12 col-md-4">
                <div class="border p-3">HTML</div>
            </div>
            <div class="col-12 col-md-4">
                <div class="border p-3">CSS</div>
            </div>
            <div class="col-12 col-md-4">
                <div class="border p-3">Bootstrap</div>
            </div>
        </div>
    </div>

    <!--
    p = padding.
    m = margin.
    t = top.
    b = bottom.
    s = start.
    e = end.
    x = eje horizontal.
    y = eje vertical.
    0 a 5 = escalas de espacio predefinidas.
    -->

    <div class="p-4 mx-5 border shadow rounded">
        <h2 class="text-primary">Agenda</h2>
        <p class="mb-0">Contenido de la conferencia.</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
