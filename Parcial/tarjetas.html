<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Parcial - Esteban Pérez Garzón</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="p-4 bg-light">
    <!-- Bootstrap: explique cómo compondría una tarjeta con card, card-body y btn. -->
    <div class="container">

        <h2>Tarjeta de Disciplina Deportiva</h2>

        <div class="card shadow w-25">
            <div class="card-body">

                <h5 class="card-title">CrossFit & Funcional</h5>
                <h6 class="card-subtitle mb-2 text-muted">Nivel: Intermedio</h6>
                <p class="card-text">Mejora tu fuerza, flexibilidad y resistencia metabólica con rutinas personalizadas.</p>

                <a href="#" class="btn btn-primary w-100">Reservar Clase</a>

            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>

</html>
