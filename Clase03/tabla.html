<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla</title>
</head>

<body>
    <table border="1">
        <caption>Tabla de Actividades</caption>

        <!-- Encabezado de la tabla -->
        <thead>
            <tr>
                <th>Hora</th>
                <th>Actividad</th>
                <th>Lugar</th>
            </tr>
        </thead>

        <!-- Cuerpo de la tabla -->
        <tbody>
            <tr>
                <td>06:00</td>
                <td>Introducción a Table en HTML</td>
                <td rowspan="3">Teams</td>
            </tr>
            <tr>
                <td>07:00</td>
                <td>Introducción a Form en HTML</td>
            </tr>
            <tr>
                <td>08:00</td>
                <td>Introducción a CSS</td>
            </tr>
        </tbody>

        <!-- Pie de la tabla -->
        <tfoot>
            <tr>
                <td colspan="3">Total de actividades: 2</td>
            </tr>
        </tfoot>
    </table>
</body>

</html>
